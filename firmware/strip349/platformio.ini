; AgentDeck v2 Firmware Draft — Waveshare ESP32-S3-Touch-LCD-3.49
; Display: 3.49" 172x640 IPS (AXS15231B QSPI), rendered landscape as 640x172
; MCU: ESP32-S3R8 (8 MB OPI PSRAM) + 16 MB QIO Flash, Native USB CDC

[platformio]
default_envs = waveshare_esp32s3_lcd349_v2

[env:waveshare_esp32s3_lcd349_v2]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

lib_deps =
    lvgl/lvgl @ ^8.3.11

build_flags =
    -I include
    -DLV_CONF_INCLUDE_SIMPLE
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HW_VERSION=2
    -DENABLE_TOUCH_KEYS=1
    -DAXS15231B_USE_VENDOR_INIT_TABLE=0

; Early discontinued V1 hardware revision (shipped before 2026-06, non-Rev1.1 PCB)
[env:waveshare_esp32s3_lcd349_v1]
extends = env:waveshare_esp32s3_lcd349_v2
build_flags =
    ${env:waveshare_esp32s3_lcd349_v2.build_flags}
    -UBOARD_HW_VERSION
    -DBOARD_HW_VERSION=1
