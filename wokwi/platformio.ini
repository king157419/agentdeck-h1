; PlatformIO config for local build + Wokwi for VS Code
[platformio]
; keep toolchains and packages on drive D
core_dir = D:/desk/hardware/.platformio

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit ILI9341@1.7.0
    adafruit/Adafruit BusIO@1.17.4
